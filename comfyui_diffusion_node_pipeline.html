.widget .title { font: var(--weight-medium) var(--text-title) var(--font-sans); margin: 0 0 var(--spacer-16); }
.widget .steps { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacer-8); margin-top: var(--spacer-16); padding-top: var(--spacer-12); border-top: 1px solid var(--border); font: var(--weight-medium) var(--text-caption) var(--font-sans); color: var(--text-muted); }
.widget .steps .num { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: var(--radius-full); background: var(--surface-muted); border: 1px solid var(--border); color: var(--text); margin-right: 4px; }
.widget .steps .num.focal { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-text); }
.t { fill: var(--text); font: var(--weight-regular) var(--text-body) var(--font-sans); }
.th { fill: var(--text); font: var(--weight-medium) var(--text-body) var(--font-sans); }
.ts { fill: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); }
.arr { stroke: var(--text-muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
g.c-neutral > rect { fill: var(--surface); stroke: var(--border); }
g.c-brand > rect { fill: var(--brand-soft); stroke: var(--brand); }
.c-brand > .th, .c-brand > .t { fill: var(--brand-text); }
.c-brand > .ts { fill: var(--brand-text); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="node-flow">
  <div class="card">
    <p class="title">ComfyUI 扩散节点：从提示词到图像</p>
    <svg viewBox="0 0 720 300" width="100%" height="auto" role="img" aria-label="扩散生成节点流程">
      <defs>
        <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="var(--text-muted)"/>
        </marker>
      </defs>

      <g class="c-neutral">
        <rect x="50" y="56" width="190" height="68" rx="8"/>
        <text class="th" x="66" y="88">CLIPLoader</text>
        <text class="ts" x="66" y="108">提示词 → 条件向量</text>
      </g>
      <g class="c-neutral">
        <rect x="50" y="140" width="190" height="68" rx="8"/>
        <text class="th" x="66" y="172">UNETLoader</text>
        <text class="ts" x="66" y="192">加载扩散主干权重</text>
      </g>
      <g class="c-neutral">
        <rect x="50" y="230" width="190" height="44" rx="22"/>
        <text class="t" x="82" y="257">初始噪声 latent</text>
      </g>

      <g class="c-brand">
        <rect x="320" y="110" width="170" height="110" rx="8"/>
        <text class="th" x="336" y="144">KSampler 采样器</text>
        <text class="ts" x="336" y="170">迭代去噪循环</text>
        <text class="ts" x="336" y="190">步数 / CFG / 种子</text>
      </g>

      <g class="c-neutral">
        <rect x="560" y="110" width="130" height="68" rx="8"/>
        <text class="th" x="576" y="142">VAEDecode</text>
        <text class="ts" x="576" y="162">latent → 像素</text>
      </g>
      <g class="c-neutral">
        <rect x="560" y="230" width="130" height="44" rx="22"/>
        <text class="t" x="586" y="257">图像/视频帧</text>
      </g>

      <path class="arr" d="M240,90 C290,90 280,132 316,136" marker-end="url(#ah)"/>
      <path class="arr" d="M240,174 L316,174" marker-end="url(#ah)"/>
      <path class="arr" d="M240,252 C290,252 282,210 316,203" marker-end="url(#ah)"/>
      <path class="arr" d="M490,165 C522,165 528,148 556,145" marker-end="url(#ah)"/>
      <path class="arr" d="M625,178 L625,224" marker-end="url(#ah)"/>
    </svg>
    <div class="steps">
      <span><span class="num">1</span>编码提示词</span><span>→</span>
      <span><span class="num">2</span>加载主干</span><span>→</span>
      <span><span class="num focal">3</span>迭代去噪</span><span>→</span>
      <span><span class="num">4</span>解码</span><span>→</span>
      <span><span class="num">5</span>输出</span>
    </div>
  </div>
</div>
</div>
<script>
(function(){
  if (typeof window.sendPrompt !== 'function') {
    window.sendPrompt = function(text) {
      console.info('[ShowWidget] sendPrompt is unavailable outside Trae:', String(text || ''));
    };
  }
})();
</script>
</body>
